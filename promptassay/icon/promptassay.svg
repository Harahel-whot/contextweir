<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- PromptAssay: an assay flask whose contents have settled into labelled layers. -->
  <rect width="512" height="512" rx="104" fill="#251f30"/>
  <defs>
    <clipPath id="flask">
      <path d="M212 120 L212 224 L112 400 C100 422 114 444 140 444 L372 444 C398 444 412 422 400 400 L300 224 L300 120 Z"/>
    </clipPath>
  </defs>
  <!-- layers inside the flask (colours match PromptAssay's size bar) -->
  <g clip-path="url(#flask)">
    <rect x="80" y="380" width="352" height="80" fill="#7fb3d5"/>
    <rect x="80" y="330" width="352" height="50" fill="#4f5a6b"/>
    <rect x="80" y="292" width="352" height="38" fill="#b39ddb"/>
    <rect x="80" y="262" width="352" height="30" fill="#e0a96d"/>
  </g>
  <!-- flask outline and lip -->
  <path d="M212 120 L212 224 L112 400 C100 422 114 444 140 444 L372 444 C398 444 412 422 400 400 L300 224 L300 120" fill="none" stroke="#e6e8ee" stroke-width="16" stroke-linejoin="round"/>
  <rect x="190" y="98" width="132" height="28" rx="10" fill="#e6e8ee"/>
  <!-- measuring marks -->
  <g stroke="#e6e8ee" stroke-width="8" stroke-linecap="round">
    <line x1="228" y1="160" x2="252" y2="160"/>
    <line x1="228" y1="192" x2="244" y2="192"/>
  </g>
  <!-- a rising bubble -->
  <circle cx="276" cy="232" r="10" fill="none" stroke="#e6e8ee" stroke-width="6"/>
  <circle cx="262" cy="196" r="6" fill="none" stroke="#e6e8ee" stroke-width="5"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
