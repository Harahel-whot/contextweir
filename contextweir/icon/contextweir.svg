<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- ContextWeir: water held behind a low weir spills over and is measured by a gauge post. -->
  <rect width="512" height="512" rx="104" fill="#1b2633"/>
  <!-- upper pool (left, higher) -->
  <path d="M48 214 C88 202 128 226 168 214 C208 202 238 222 268 214 L268 432 L48 432 Z" fill="#33658c"/>
  <path d="M48 214 C88 202 128 226 168 214 C208 202 238 222 268 214" fill="none" stroke="#9cc6e4" stroke-width="10" stroke-linecap="round"/>
  <!-- the weir: a stone sill -->
  <path d="M258 206 L316 206 L332 432 L250 432 Z" fill="#c8d2dc"/>
  <path d="M258 206 L316 206" stroke="#eef2f6" stroke-width="10" stroke-linecap="round"/>
  <!-- water spilling over the crest -->
  <path d="M300 200 C352 200 372 250 378 318 L348 318 C344 268 330 238 300 232 Z" fill="#7fb3d5"/>
  <!-- lower pool (right) -->
  <path d="M332 318 C368 308 404 328 464 316 L464 432 L332 432 Z" fill="#33658c"/>
  <path d="M332 318 C368 308 404 328 464 316" fill="none" stroke="#9cc6e4" stroke-width="10" stroke-linecap="round"/>
  <!-- splash -->
  <circle cx="392" cy="300" r="9" fill="#9cc6e4"/>
  <circle cx="410" cy="286" r="6" fill="#9cc6e4"/>
  <!-- gauge post with marks -->
  <rect x="120" y="96" width="22" height="300" rx="6" fill="#d9a441"/>
  <g stroke="#1b2633" stroke-width="7" stroke-linecap="round">
    <line x1="124" y1="132" x2="138" y2="132"/>
    <line x1="124" y1="168" x2="138" y2="168"/>
    <line x1="124" y1="204" x2="138" y2="204"/>
  </g>
  <rect x="142" y="126" width="34" height="12" rx="4" fill="#d9a441"/>
  <rect x="142" y="198" width="34" height="12" rx="4" fill="#d9a441"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
